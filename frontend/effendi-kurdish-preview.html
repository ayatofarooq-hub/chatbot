<!doctype html>
<html lang="ckb" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پێشبینینی مُجيب بە جل و بەرگی کوردی</title>
<style>
  :root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f8f6;color:#123f2d;font-family:system-ui;text-align:center}body.dark{background:#14231d;color:#f5faf7}.card{padding:24px;border-radius:28px;background:color-mix(in srgb,currentColor 5%,transparent);box-shadow:0 18px 60px #0002}.sprite{width:288px;height:384px;margin:auto;background:url('/assets/images/ai-effendi/fallback/effendi-kurdish-idle-8-aligned-transparent-v1.png') no-repeat;background-size:400% 200%}button{border:0;border-radius:14px;padding:11px 18px;background:#145d3c;color:#fff;font:inherit;cursor:pointer}p{font-size:14px;opacity:.78}</style>
<main class="card">
  <h2>مُجيب بە جل و بەرگی کوردی</h2>
  <div class="sprite" role="img" aria-label="کارەکتەری کوردی بە جل و بەرگی کوردی"></div>
  <button>گۆڕینی پاشبنەما</button>
  <p>٨ فریم — پاشبنەمای شەفاف</p>
</main>
<script>
  const sprite=document.querySelector('.sprite');let frame=0;
  setInterval(()=>{frame=(frame+1)%8;sprite.style.backgroundPosition=`${frame%4*100/3}% ${Math.floor(frame/4)*100}%`},240);
  document.querySelector('button').onclick=()=>document.body.classList.toggle('dark');
</script>
</html>
